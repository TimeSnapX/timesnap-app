name = "timesnap-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# Secret (never commit): wrangler secret put GEMINI_API_KEY
# Local dev: put GEMINI_API_KEY=... in worker/.dev.vars (gitignored)

[vars]
ALLOWED_ORIGINS = "https://timesnapx.github.io"
MAX_BODY_BYTES = "8388608"
RATE_LIMIT_PER_MINUTE = "10"
